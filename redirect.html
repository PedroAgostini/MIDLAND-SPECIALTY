<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midland Specialty Inc. | Digital Card</title>
<meta name="description" content="Connect with Midland Specialty Inc. through our website, social channels, phone, or email.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#0b1120;
    --navy-2:#10182a;
    --navy-3:#16213b;
    --gold:#b5956d;
    --gold-2:#cdb190;
    --cream:#f7f3ec;
    --muted:#9aa0ad;
    --line:rgba(205,177,144,.22);
  }
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 620px at 72% 8%,rgba(24,96,129,.28),transparent 62%),
      radial-gradient(760px 580px at 18% 92%,rgba(181,149,109,.18),transparent 64%),
      linear-gradient(180deg,#080d18 0%,var(--navy) 52%,#070b14 100%);
    color:var(--cream);
    font-family:'Source Serif 4',Georgia,serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(205,177,144,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(205,177,144,.035) 1px,transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(circle at 50% 45%,black,transparent 74%);
  }
  body:after{
    content:"";
    position:fixed;
    inset:auto -10% -22% -10%;
    height:46vh;
    pointer-events:none;
    background:radial-gradient(closest-side,rgba(181,149,109,.12),transparent 72%);
    filter:blur(10px);
  }
  a{color:inherit}
  .shell{
    min-height:100vh;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(28px,5vw,54px) 18px;
  }
  .ambient-line{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .ambient-line span{
    position:absolute;
    width:420px;
    height:420px;
    border:1px solid rgba(205,177,144,.11);
    border-radius:50%;
    animation:floatRing 11s ease-in-out infinite;
  }
  .ambient-line span:first-child{top:7%;right:-160px}
  .ambient-line span:last-child{bottom:8%;left:-190px;animation-delay:-4s}
  .card{
    width:92vw;
    max-width:470px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(205,177,144,.26);
    border-radius:28px;
    padding:clamp(28px,6vw,42px);
    background:
      linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.025) 48%,rgba(181,149,109,.08)),
      rgba(12,19,34,.82);
    box-shadow:0 44px 110px -58px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    animation:cardIn .9s cubic-bezier(.22,1,.36,1) both;
  }
  .card:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.12) 34%,transparent 58%);
    transform:translateX(-120%);
    animation:shine 5.4s ease-in-out 1.1s infinite;
  }
  .card-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .mark-wrap{
    width:min(100%,285px);
    border:0;
    border-radius:0;
    display:grid;
    place-items:center;
    background:transparent;
    box-shadow:none;
    margin-bottom:4px;
  }
  .mark-wrap img{
    width: 70%;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.36));
  }
  h1{
    font-family:'DM Serif Display',serif;
    font-size:clamp(34px,9vw,48px);
    font-weight:400;
    line-height:.95;
    letter-spacing:.01em;
    color:var(--cream);
    text-wrap:balance;
  }
  .company{
    margin-top:13px;
    font-size:12px;
    letter-spacing:.33em;
    text-transform:uppercase;
    color:var(--gold-2);
    font-weight:700;
  }
  .tagline{
    max-width:30ch;
    margin:18px auto 0;
    color:#c8ced8;
    font-size:16px;
    line-height:1.62;
    text-wrap:pretty;
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-top:32px;
  }
  .action{
    position:relative;
    min-height:62px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 16px 15px 18px;
    border:1px solid rgba(205,177,144,.2);
    border-radius:18px;
    background:rgba(255,255,255,.045);
    color:var(--cream);
    text-decoration:none;
    transition:transform .28s ease,border-color .28s ease,background .28s ease,box-shadow .28s ease;
    isolation:isolate;
  }
  .action:hover,
  .action:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(205,177,144,.52);
    background:rgba(181,149,109,.12);
    box-shadow:0 22px 46px -32px rgba(0,0,0,.9);
    outline:none;
  }
  .action .icon{
    width:42px;
    height:42px;
    flex:0 0 auto;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:rgba(181,149,109,.14);
    color:var(--gold-2);
    font-size:22px;
  }
  .icon svg,
  .arrow svg{
    width:1em;
    height:1em;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .icon .brand-glyph{
    font-family:Arial,Helvetica,sans-serif;
    font-size:24px;
    line-height:1;
    font-weight:700;
  }
  .action strong{
    display:block;
    font-size:17px;
    line-height:1.1;
    font-weight:700;
  }
  .action small{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:13px;
    line-height:1.2;
    overflow-wrap:anywhere;
  }
  .action > span:not(.icon):not(.arrow){min-width:0}
  .action .arrow{
    margin-left:auto;
    flex:0 0 auto;
    color:rgba(205,177,144,.8);
    font-size:18px;
    transition:transform .28s ease;
  }
  .action:hover .arrow,
  .action:focus-visible .arrow{transform:translateX(4px)}
  .meta{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid rgba(205,177,144,.16);
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    color:#858d9f;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .footer{
    width:92vw;
    max-width:640px;
    margin-top:26px;
    text-align:center;
    color:#687184;
    font-size:13px;
    line-height:1.65;
    animation:cardIn .9s cubic-bezier(.22,1,.36,1) .12s both;
  }
  .footer a{
    color:#9aa0ad;
    text-decoration:none;
    transition:color .25s ease;
  }
  .footer a:hover{color:var(--gold-2)}
  .footer .credit a{color:#FFA300;font-weight:700}
  @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes shine{0%,48%{transform:translateX(-120%)}72%,100%{transform:translateX(120%)}}
  @keyframes floatRing{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.04)}}
  @media (max-width:520px){
    .shell{justify-content:flex-start;padding:18px 14px 22px}
    .card,.footer{width:86vw}
    .card{border-radius:24px;padding:22px 18px}
    .mark-wrap{width:min(100%,240px);margin-bottom:2px}
    .mark-wrap img{width:100%;height:auto}
    h1{font-size:clamp(32px,10vw,42px)}
    .company{font-size:10px;letter-spacing:.27em}
    .tagline{font-size:14px;line-height:1.48;margin-top:14px}
    .actions{gap:9px;margin-top:22px}
    .action{min-height:54px;border-radius:15px;padding:11px 12px 11px 14px;gap:12px}
    .action .icon{width:37px;height:37px;border-radius:12px;font-size:19px}
    .action strong{font-size:16px}
    .action small{font-size:12px;line-height:1.15}
    .action .arrow{font-size:17px}
    .action .arrow{display:none}
    .meta{margin-top:18px;padding-top:16px}
    .meta{gap:8px;font-size:10px;letter-spacing:.06em}
    .footer{font-size:12px}
    .footer .credit{max-width:28ch;margin-left:auto;margin-right:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
